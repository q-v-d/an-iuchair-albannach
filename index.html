<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15121c">
<title>An Iuchair Albannach</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: one-column phone-first "reisdagboek": sticky kaart bovenaan met voortgang, daaronder één station per scherm. */
:root{
  --bg:#15121c;        /* veen-nacht */
  --surface:#211c2d;   /* leisteen */
  --surface-2:#2b2440;
  --line:#3b3353;
  --fg:#efe6d4;        /* perkament */
  --muted:#b3a99a;
  --heather:#b48ad6;   /* heide */
  --gold:#d9a441;      /* whisky */
  --loch:#4f9b97;      /* loch */
  --ok:#7fc48c;
  --bad:#e07a6a;
  --font-display:"Fraunces",Georgia,"Times New Roman",serif;
  --font-body:"Alegreya Sans","Gill Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:20px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.muted{color:var(--muted)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
.btn{background:var(--heather);color:#1a1226;font-weight:700;padding:14px 20px;width:100%;font-size:17px;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--heather);border:1.5px solid var(--heather)}
.btn.small{width:auto;padding:8px 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* kop */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.top .name{font-family:var(--font-display);font-size:18px}
.top .meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.route{display:flex;gap:6px;padding-block:10px}
.route span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.route span.done{background:var(--gold)}
.route span.now{background:var(--heather)}
.nav{display:flex;gap:8px;justify-content:space-between}
.nav .btn{flex:1;padding:8px 6px;white-space:nowrap}

/* hero */
.hero{display:grid;gap:14px;padding-block:22px 6px;text-align:left}
.hero h1{font-size:44px;font-weight:700;font-variation-settings:"opsz" 144}
.hero h1 em{font-style:italic;color:var(--heather)}
.tartan{height:14px;border-radius:7px;background:
  repeating-linear-gradient(90deg,#2d5b3e 0 18px,#1b2e4a 18px 30px,#9b2c2c 30px 36px,#1b2e4a 36px 48px,#d9a441 48px 52px,#1b2e4a 52px 64px)}

/* kaarten */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px;min-width:0}
.card.fact{border-color:transparent;background:linear-gradient(135deg,var(--surface-2),var(--surface));position:relative}
.card.fact::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:2px;background:var(--gold)}
.card.mine{border-color:var(--heather)}
.card.theirs{border-style:dashed}
.role-tag{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.role-tag::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid currentColor;flex:none}
.avatar.lg{width:84px;height:84px}
.who{display:flex;align-items:center;gap:12px}
.roles .btn{display:flex;align-items:center;gap:14px;text-align:left}
.roles .btn span{display:grid;gap:2px}
.duo{display:flex;justify-content:center;gap:-10px}
.duo img{margin:0 -8px;border-color:var(--gold)}
.role-a{color:var(--heather)}
.role-b{color:var(--loch)}
.clue{display:grid;gap:10px}
.roles{display:grid;gap:10px}
.roles .btn small{font-weight:400;opacity:.85}
.roles .btn.b{background:var(--loch)}
.roles .btn.both{background:var(--gold)}

/* puzzelvisuals */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week div{background:var(--surface-2);border-radius:10px;padding:8px 0;display:grid;gap:2px}
.week b{font-family:var(--font-display);font-size:20px;color:var(--gold);font-variant-numeric:tabular-nums}
.week small{font-size:12px;color:var(--muted)}
.sonar{display:grid;grid-template-columns:28px repeat(5,1fr);gap:4px;text-align:center;font-variant-numeric:tabular-nums}
.sonar div{padding:8px 0;border-radius:8px;background:var(--surface-2);font-family:var(--font-display);font-size:19px}
.sonar .h{background:transparent;color:var(--loch);font-family:var(--font-body);font-size:13px;font-weight:700}
.bands{display:flex;height:64px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.bands span{flex:1}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.legend div{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:10px;padding:8px 10px}
.legend i{width:22px;height:22px;border-radius:5px;display:inline-block;border:1px solid rgba(255,255,255,.15)}
.legend b{font-family:var(--font-display);font-size:20px;color:var(--gold)}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.slots div{width:40px;height:48px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--font-display);font-size:24px;position:relative}
.slots div.empty{border:1.5px dashed var(--line);background:transparent;color:var(--line)}
.slots small{position:absolute;top:2px;right:5px;font-size:10px;color:var(--muted);font-family:var(--font-body)}
.cask{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cask div{background:var(--surface-2);border-radius:10px;padding:10px;text-align:center}
.cask b{display:block;font-family:var(--font-display);font-size:26px;color:var(--gold)}
.cask small{color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.quaich{display:grid;place-items:center;padding:6px 0}

/* antwoord */
.answer{display:grid;gap:10px}
.answer input{width:100%;font:inherit;font-size:22px;letter-spacing:.12em;text-transform:uppercase;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);text-align:center;font-family:var(--font-display)}
.answer input.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{min-height:22px;font-size:15px}
.feedback.bad{color:var(--bad)}
.feedback.ok{color:var(--ok)}
.hintbox{font-size:15px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.tokens{display:flex;flex-wrap:wrap;gap:8px}
.token{background:var(--surface-2);border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:4px 12px;font-family:var(--font-display);font-size:15px}
.token.locked{border-color:var(--line);color:var(--line)}
.solved{text-align:center;display:grid;gap:12px;padding-block:8px}
.solved .big{font-family:var(--font-display);font-size:30px;color:var(--gold)}
.final h1{font-size:34px}
.letter{font-size:18px;line-height:1.6;font-family:var(--font-display);font-weight:400;white-space:pre-line}
.actions{display:grid;gap:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <div class="top" id="top" hidden>
    <span class="name">An Iuchair Albannach</span>
    <span class="meta" id="meta"></span>
  </div>
  <div id="app"></div>
</div>

<script>
// ───────── PAS HIER AAN ─────────
const CONFIG = {
  bruid: "Yenthe",          // naam van de bruid
  bruidegom: "Renaat",  // naam van de verloofde
  afzender: "Quinten & Jente",  // wie het cadeau geeft
  slotbrief: `Jullie hebben An Iuchair Albannach gevonden: de Schotse Sleutel.

Bij onze trouw kregen wij van jullie een Ierse geluksmunt en een gelukshanger. Dit keer reizen de gelukssymbolen met jullie mee naar Schotland.

Zoek daar de luckenbooth: twee hartjes met een kroon, het Schotse teken van trouw dat al 300 jaar aan een geliefde wordt gegeven. Dat is onze volgende schakel in de traditie.

Veel geluk op de reis en op de rest van de weg samen.
Slàinte mhath!`
};
// ────────────────────────────────

const STATIONS = [
  {
    place:"Dùn Èideann", placeNl:"Edinburgh", title:"Het kanon van één uur", token:"Fàilte", tokenNl:"welkom",
    intro:"Jullie reis begint onder de rots van Edinburgh Castle. Iedere middag schrikt een toerist op van een kanonschot. Dat is niet zomaar lawaai: het is een klok.",
    fact:"Sinds 1861 vuurt de One O'Clock Gun elke dag om 13:00, zodat schepen in de haven van Leith hun chronometer gelijk konden zetten. Eén dag in de week blijft het stil.",
    a:`<p>Jij hebt het dienstrooster van de kanonniers. Elke dag draagt een nummer.</p>
       <div class="week">
        <div><small>ma</small><b>18</b></div><div><small>di</small><b>25</b></div><div><small>wo</small><b>31</b></div>
        <div><small>do</small><b>09</b></div><div><small>vr</small><b>56</b></div><div><small>za</small><b>77</b></div><div><small>zo</small><b>42</b></div>
       </div>`,
    b:`<p>Jij hebt het reglement van het kasteel:</p>
       <p><em>"Het kanon vuurt zes dagen per week om 13:00 uur. Op de dag des Heren en op Kerstdag zwijgt het."</em></p>
       <p>De code is: het nummer van de stille weekdag, gevolgd door het uur van het schot in 24-uursnotatie (twee cijfers).</p>`,
    hint:"Op zondag rusten de kanonniers. Nummer van zondag + '13'.",
    answer:"4213",
    reveal:"Vóór het kanon viel er al een tijdbal: op de Nelson-zuil op Calton Hill zakt nog elke dag om 13:00 een grote bal naar beneden. Kijk omhoog als je er bent."
  },
  {
    place:"Loch Nis", placeNl:"Loch Ness", title:"Sonar in het donkere water", token:"Uisge", tokenNl:"water",
    intro:"Noordwaarts, naar het loch dat meer zoet water bevat dan alle meren van Engeland en Wales samen. Jullie sonar vangt iets op.",
    fact:"De beroemdste foto van Nessie uit 1934 bleek in 1994 een grap: een speelgoedonderzeeër met een boetseerklei-nek. Het verhaal van het monster is wel veel ouder: al in 565 zou de heilige Columba een waterbeest hebben verjaagd.",
    a:`<p>Jij ziet het sonarscherm. Iedere cel toont één letter.</p>
       <div class="sonar">
        <div class="h"></div><div class="h">1</div><div class="h">2</div><div class="h">3</div><div class="h">4</div><div class="h">5</div>
        <div class="h">A</div><div>M</div><div>K</div><div>R</div><div>T</div><div>O</div>
        <div class="h">B</div><div>S</div><div>L</div><div>U</div><div>E</div><div>N</div>
        <div class="h">C</div><div>P</div><div>I</div><div>W</div><div>H</div><div>G</div>
        <div class="h">D</div><div>A</div><div>Y</div><div>E</div><div>D</div><div>B</div>
        <div class="h">E</div><div>F</div><div>C</div><div>O</div><div>X</div><div>Q</div>
       </div>`,
    b:`<p>Jij hebt het logboek van de boot met de sonarsignalen, in volgorde:</p>
       <p style="font-family:var(--font-display);font-size:24px;color:var(--loch);letter-spacing:.1em">A2 · B4 · B2 · C1 · C2 · D3</p>
       <p>Lees de letters af en jullie kennen de naam van het wezen dat volgens de Schotse legende in elk loch woont: een paard dat je het water in lokt.</p>`,
    hint:"Rij (letter) eerst, dan kolom (cijfer). Zes letters, eindigt op -IE.",
    answer:"KELPIE",
    reveal:"Bij Falkirk staan twee kelpies van 30 meter hoog in staal. Ze zijn de grootste paardenbeelden ter wereld en staan op de weg tussen Edinburgh en Glasgow."
  },
  {
    place:"An t-Eilean Sgitheanach", placeNl:"Isle of Skye", title:"De verboden ruit", token:"Clann", tokenNl:"familie",
    intro:"Over de brug naar Skye, thuisbasis van clan MacLeod. In de burcht Dunvegan hangt een oude lap stof die de clan al eeuwen beschermt. Jullie vinden een andere lap: een tartan met een boodschap.",
    fact:"Na de slag bij Culloden in 1746 verbood de Dress Act het dragen van tartan en kilt in de Highlands. Wie het toch deed, riskeerde zes maanden cel of deportatie. Het verbod hield 36 jaar stand.",
    a:`<p>Jij hebt de stof. Lees de banden van links naar rechts.</p>
       <div class="bands">
        <span style="background:#1f3a66"></span><span style="background:#9b2c2c"></span><span style="background:#2d5b3e"></span><span style="background:#d9a441"></span>
       </div>
       <p class="muted" style="font-size:14px">Vier kleuren, vier banden.</p>`,
    b:`<p>Jij hebt het weefboek van de clan. Elke kleur draagt een cijfer:</p>
       <div class="legend">
        <div><i style="background:#9b2c2c"></i><span>Rood</span><b>3</b></div>
        <div><i style="background:#2d5b3e"></i><span>Groen</span><b>1</b></div>
        <div><i style="background:#1f3a66"></i><span>Blauw</span><b>7</b></div>
        <div><i style="background:#d9a441"></i><span>Geel</span><b>9</b></div>
        <div><i style="background:#111"></i><span>Zwart</span><b>0</b></div>
        <div><i style="background:#efe6d4"></i><span>Wit</span><b>5</b></div>
       </div>
       <p>Vier banden geven een code van vier cijfers.</p>`,
    hint:"Blauw, rood, groen, geel. Zoek de cijfers erbij.",
    answer:"7319",
    reveal:"Het Scottish Register of Tartans telt meer dan 7.000 geregistreerde patronen, en iedereen mag een eigen ontwerp laten vastleggen. Een eigen huwelijkstartan is dus een echt ding."
  },
  {
    place:"Inbhir Nis", placeNl:"Inverness", title:"De heildronk", token:"Slàinte", tokenNl:"gezondheid",
    intro:"In een pub aan de rivier de Ness staat een bord met een afgebrokkeld woord. Het is wat Schotten zeggen voor ze hun glas heffen. Jullie hebben elk de helft van de letters.",
    fact:"Op Burns Night, 25 januari, wordt de haggis plechtig binnengedragen op doedelzakmuziek en toegesproken met een gedicht van Robert Burns, voor hij met een dolk wordt opengesneden. In de VS is haggis sinds 1971 verboden, omdat er schapenlong in zit.",
    a:`<p>Jij hebt de letters op de <strong>oneven</strong> plaatsen (1, 3, 5, 7):</p>
       <div class="slots">
        <div>S<small>1</small></div><div class="empty">·<small>2</small></div><div>A<small>3</small></div><div class="empty">·<small>4</small></div>
        <div>N<small>5</small></div><div class="empty">·<small>6</small></div><div>E<small>7</small></div>
       </div>`,
    b:`<p>Jij hebt de letters op de <strong>even</strong> plaatsen (2, 4, 6):</p>
       <div class="slots">
        <div class="empty">·<small>1</small></div><div>L<small>2</small></div><div class="empty">·<small>3</small></div><div>I<small>4</small></div>
        <div class="empty">·<small>5</small></div><div>T<small>6</small></div><div class="empty">·<small>7</small></div>
       </div>
       <p>Het woord betekent 'gezondheid' en vul je in zonder accent.</p>`,
    hint:"Spel het samen, plaats per plaats. Het begint met S en eindigt op E.",
    answer:"SLAINTE",
    reveal:"Het volledige antwoord op 'Slàinte!' is 'Slàinte mhath!' (spreek uit: slaantsje va). En whisky heet in het Gaelic 'uisge beatha': water van het leven. Daar komt het woord whisky vandaan."
  },
  {
    place:"Srath Spè", placeNl:"Speyside", title:"Het aandeel van de engelen", token:"Beatha", tokenNl:"leven",
    intro:"Langs de rivier de Spey liggen meer distilleerderijen dan waar ook ter wereld. In een pakhuis staat één vat met een handgeschreven etiket, maar de helft van de informatie staat in het boek van de stoker.",
    fact:"Scotch mag pas Scotch heten na minstens drie jaar rijping in eiken vaten, op Schotse bodem. Al die tijd verdampt een deel door het hout. Dat verlies heet the angels' share.",
    a:`<p>Jij leest het etiket op het vat:</p>
       <div class="cask">
        <div><small>Gevuld</small><b>2014</b></div>
        <div><small>Gebotteld</small><b>2026</b></div>
       </div>
       <p>Reken uit hoeveel jaar het vat heeft gerijpt.</p>`,
    b:`<p>Jij hebt het boek van de stoker:</p>
       <p><em>"Ieder jaar nemen de engelen twee procent van wat in het vat zit. Vermenigvuldig de jaren met twee en je weet hoeveel procent naar de hemel is gegaan."</em></p>
       <p>De code is dat percentage, als getal.</p>`,
    hint:"12 jaar × 2 procent.",
    answer:"24",
    reveal:"Schotland telt meer dan 140 werkende distilleerderijen. Het grootste deel van de whisky die er rijpt, is ouder dan de mensen die hem bottelen. Op Speyside kun je bij de meeste gewoon binnenlopen voor een proeverij."
  },
  {
    place:"Gretna Green", placeNl:"het dorp van de smid", title:"De smid en de beker", token:"Gràdh", tokenNl:"liefde",
    intro:"Jullie laatste halte ligt net over de Engelse grens: het dorp waar al 270 jaar stiekem getrouwd wordt. De smid wacht bij het aambeeld, maar de kluis gaat pas open als jullie samen de naam van het laatste voorwerp kennen.",
    fact:"Sinds 1754 vluchtten jonge Engelse stellen naar Gretna Green, omdat je in Schotland zonder toestemming van je ouders mocht trouwen. De smid voltrok het huwelijk met een hamerslag op het aambeeld. Die 'anvil priests' trouwden tot 5.000 stellen per jaar.",
    a:`<p>Jij ziet het voorwerp op tafel:</p>
       <div class="quaich">
        <svg viewBox="0 0 220 110" width="220" height="110" role="img" aria-label="Lage beker met twee handvatten">
         <path d="M40 40 H180 L165 85 Q110 100 55 85 Z" fill="#d9a441"/>
         <path d="M40 40 H180" stroke="#f3d58a" stroke-width="4"/>
         <path d="M40 46 H6 V62 H44" fill="none" stroke="#d9a441" stroke-width="10" stroke-linecap="round"/>
         <path d="M180 46 H214 V62 H176" fill="none" stroke="#d9a441" stroke-width="10" stroke-linecap="round"/>
         <ellipse cx="110" cy="40" rx="70" ry="9" fill="#b8832a"/>
        </svg>
       </div>
       <p>Een lage beker met twee oren. Het bruidspaar drinkt er tijdens de ceremonie samen uit: een hand per oor. Een vriendschapsbeker.</p>`,
    b:`<p>Jij hebt de aantekening van de smid:</p>
       <p><em>"Zes letters. De Schotten noemen hem naar het Gaelic woord 'cuach', maar ze schrijven de eerste klank met een letter die in het Gaelic alfabet niet bestaat. Dat alfabet telt maar 18 letters: geen J, K, Q, V, W, X, Y of Z."</em></p>
       <p>Verwerk 'cuach' tot het Schotse woord met die vreemde beginletter.</p>`,
    hint:"Begint met QU en eindigt op -CH.",
    answer:"QUAICH",
    reveal:"De traditie waarin dit cadeau past: de luckenbooth. Twee verstrengelde hartjes met een kroon erboven, al sinds de 17e eeuw in Edinburgh aan een geliefde gegeven als teken van trouw en geluk. Jullie vinden ze in elke juwelier in Schotland."
  }
];

const KEY="schotse-sleutel-v1";
let state = load() || { role:null, step:0, solved:[], start:null, hints:{} };
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function norm(s){ return (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z0-9]/g,""); }

const app=document.getElementById("app"), bar=document.getElementById("top"), meta=document.getElementById("meta");

function roleLabel(){ return state.role==="a"?CONFIG.bruid : state.role==="b"?CONFIG.bruidegom : "Samen"; }
function elapsed(){ if(!state.start) return "0:00"; const s=Math.floor((Date.now()-state.start)/1000); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
setInterval(()=>{ if(state.start && state.step<STATIONS.length) meta.textContent = roleLabel()+" · "+elapsed(); },1000);

function render(){
  if(!state.role){ bar.hidden=true; renderStart(); return; }
  bar.hidden=false; meta.textContent=roleLabel()+" · "+elapsed();
  if(state.step>=STATIONS.length){ renderFinal(); return; }
  renderStation(STATIONS[state.step]);
}

function renderStart(){
  app.innerHTML=`
   <div class="hero">
    <span class="eyebrow">Online escape game · Schotland</span>
    <h1>An Iuchair <em>Albannach</em></h1>
    <p class="muted" style="font-size:14px;letter-spacing:.06em;margin-top:-6px">De Schotse Sleutel</p>
    <p class="muted" style="font-size:14px">Een missie voor ${CONFIG.bruid} &amp; ${CONFIG.bruidegom}</p>
    <div class="tartan"></div>
    <p>Zes haltes van Edinburgh tot Gretna Green. Bij elke halte krijgt ieder van jullie de helft van de aanwijzing. Alleen samen vinden jullie de code die de kluis van de smid opent.</p>
    <p class="muted">Speel elk op je eigen gsm en kies je rol, of speel samen op één toestel. Jullie mogen alles aan elkaar vertellen. Jullie mogen ook niets opzoeken, maar dat controleert niemand.</p>
   </div>
   <div class="roles">
    <button class="btn a" data-role="a"><img class="avatar" src="yenthe.jpg" alt=""><span>${CONFIG.bruid}<small>Ik zie de voorwerpen, kaarten en etiketten</small></span></button>
    <button class="btn b" data-role="b"><img class="avatar" src="renaat.jpg" alt=""><span>${CONFIG.bruidegom}<small>Ik zie de reglementen, logboeken en legendes</small></span></button>
    <button class="btn both" data-role="both"><span>Samen op één gsm<small>Alle aanwijzingen op één scherm</small></span></button>
   </div>
   <p class="muted" style="font-size:14px">Met liefde in elkaar gezet door ${CONFIG.afzender}. <em>Fàilte gu Alba</em> is Gaelic voor 'welkom in Schotland'.</p>`;
  app.querySelectorAll("[data-role]").forEach(b=>b.addEventListener("click",()=>{ state.role=b.dataset.role; state.start=state.start||Date.now(); save(); render(); window.scrollTo(0,0); }));
}

function clueCard(st, who){
  const mine = state.role===who || state.role==="both";
  const name = who==="a"?CONFIG.bruid:CONFIG.bruidegom;
  const img=who==="a"?"yenthe.jpg":"renaat.jpg";
  const head=`<div class="who role-${who}"><img class="avatar" src="${img}" alt=""><span class="role-tag role-${who}">Aanwijzing van ${name}</span></div>`;
  if(mine) return `<div class="card mine">${head}<div class="clue">${who==="a"?st.a:st.b}</div></div>`;
  return `<div class="card theirs">${head}<p class="muted">Dit deel staat alleen op de gsm van ${name}. Vraag ernaar, of leg jullie schermen naast elkaar.</p></div>`;
}

function renderStation(st){
  const i=state.step, solved=state.solved.includes(i), hinted=!!state.hints[i];
  app.innerHTML=`
   <div class="route">${STATIONS.map((s,k)=>`<span class="${k<i?'done':k===i?'now':''}"></span>`).join("")}</div>
   <div class="nav">
    <button class="btn ghost small" id="back" ${i>0?"":"disabled"}>← Vorige</button>
    <button class="btn ghost small" id="home">Startscherm</button>
    <button class="btn ghost small" id="fwd" ${solved?"":"disabled"}>Volgende →</button>
   </div>
   <div class="hero" style="padding-block:4px">
    <span class="eyebrow">Halte ${i+1} van ${STATIONS.length} · ${st.place}</span>
    <p class="muted" style="font-size:13px;margin-top:-8px">${st.placeNl}</p>
    <h2 style="font-size:32px">${st.title}</h2>
    <p>${st.intro}</p>
   </div>
   <div class="card fact"><span class="eyebrow" style="color:var(--gold)">Wist je dat</span><p>${st.fact}</p></div>
   ${clueCard(st,"a")}
   ${clueCard(st,"b")}
   ${solved ? solvedBlock(st,i) : `
   <div class="card answer">
    <label for="ans-${i}" class="eyebrow" style="color:var(--heather)">Jullie antwoord</label>
    <input id="ans-${i}" autocomplete="off" autocapitalize="characters" inputmode="${/^\d+$/.test(st.answer)?'numeric':'text'}" placeholder="${/^\d+$/.test(st.answer)?'cijfers':'woord'}">
    <div class="feedback" id="fb"></div>
    <button class="btn" id="check">Controleer</button>
    ${hinted?`<div class="hintbox">Hint: ${st.hint}</div>`:`<button class="btn ghost small" id="hint" style="justify-self:center">Geef een hint</button>`}
   </div>`}
   <div class="tokens">${STATIONS.map((s,k)=>`<span class="token ${state.solved.includes(k)?'':'locked'}">${state.solved.includes(k)?s.token:'·····'}</span>`).join("")}</div>
`;

  const input=app.querySelector("#ans-"+i), fb=app.querySelector("#fb");
  const check=()=>{
    if(norm(input.value)===norm(st.answer)){ state.solved.push(i); save(); render(); window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"}); }
    else{ fb.className="feedback bad"; fb.textContent="Dat is het niet. Overleg nog eens, of vraag een hint."; input.classList.remove("shake"); void input.offsetWidth; input.classList.add("shake"); }
  };
  app.querySelector("#check")?.addEventListener("click",check);
  input?.addEventListener("keydown",e=>{ if(e.key==="Enter") check(); });
  app.querySelector("#hint")?.addEventListener("click",()=>{ state.hints[i]=true; save(); render(); });
  app.querySelector("#next")?.addEventListener("click",()=>{ state.step=i+1; save(); render(); window.scrollTo(0,0); });
  app.querySelector("#back")?.addEventListener("click",()=>{ if(i>0){ state.step=i-1; save(); render(); window.scrollTo(0,0); } });
  app.querySelector("#fwd")?.addEventListener("click",()=>{ if(solved){ state.step=i+1; save(); render(); window.scrollTo(0,0); } });
  app.querySelector("#home")?.addEventListener("click",()=>{ state.role=null; save(); render(); window.scrollTo(0,0); });
}

function solvedBlock(st,i){
  return `<div class="card solved">
    <span class="eyebrow" style="color:var(--ok)">Opgelost</span>
    <div class="big">${st.token}</div>
    <p class="muted">Gaelic voor <em>${st.tokenNl}</em>. Jullie ${i+1}e woord.</p>
    <p>${st.reveal}</p>
    <button class="btn" id="next">${i+1<STATIONS.length?"Naar "+STATIONS[i+1].placeNl+" →":"Open de kluis"}</button>
   </div>`;
}

function renderFinal(){
  app.innerHTML=`
   <div class="route">${STATIONS.map(()=>`<span class="done"></span>`).join("")}</div>
   <div class="hero final">
    <div class="duo"><img class="avatar lg" src="yenthe.jpg" alt=""><img class="avatar lg" src="renaat.jpg" alt=""></div>
    <span class="eyebrow">De kluis van de smid</span>
    <h1>Een hamerslag op het aambeeld.</h1>
    <div class="tartan"></div>
    <p>Zes haltes, zes woorden, één sleutel. Jullie deden er ${elapsed()} over.</p>
   </div>
   <div class="tokens">${STATIONS.map(s=>`<span class="token">${s.token}</span>`).join("")}</div>
   <div class="card"><p class="muted" style="font-size:14px">Fàilte · Uisge · Clann · Slàinte · Beatha · Gràdh: welkom, water, familie, gezondheid, leven, liefde. Genoeg Gaelic voor een hele huwelijksreis.</p></div>
   <div class="card fact"><span class="eyebrow">Voor ${CONFIG.bruid} &amp; ${CONFIG.bruidegom}</span><p class="letter">${CONFIG.slotbrief}</p><p class="muted">— ${CONFIG.afzender}</p></div>
   <div class="actions">
    <button class="btn ghost small" id="reset">Opnieuw spelen</button>
   </div>`;
  app.querySelector("#reset").addEventListener("click",()=>{ state={role:null,step:0,solved:[],start:null,hints:{}}; save(); render(); window.scrollTo(0,0); });
}

render();
</script>

</body>
</html>
