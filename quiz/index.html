<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#132539">
<title>Cuimhne · De fotoquiz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Zelfde huisstijl als het spel: nachtblauw, goud, één kaart per scherm. */
:root{
  --bg:#132539; --surface:#1E3854; --fg:#F5F7FA; --muted:#B4C3D4;
  --accent:#A68D5A; --accent-text:#D2BF92; --accent-ink:#14263A;
  --tint:#294A6F; --line:#3B5C82; --ok:#8FC9A0; --ok-bg:#2b5a46; --bad:#E39A8C; --bad-bg:#5a2f33;
  --font-display:"IM Fell English SC","Iowan Old Style",Georgia,serif;
  --font-body:"Playfair Display",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px;-webkit-font-smoothing:antialiased}
img{max-width:100%}
[hidden]{display:none!important}
.app{max-width:520px;margin:0 auto;display:grid;gap:12px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 4px 0}
.bar .count{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-text);font-weight:600;font-variant-numeric:tabular-nums}
.score{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-weight:700;font-variant-numeric:tabular-nums}
.score b{font-family:var(--font-display);font-size:20px;color:var(--accent);font-weight:400}
.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);transition:width .3s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:22px 20px 26px;display:grid;gap:16px;min-width:0}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-text)}
h1,h2{font-family:var(--font-display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:clamp(2.6rem,13vw,3.6rem);line-height:.98}
h1 em{font-style:normal;color:var(--accent)}
h1 .sub{display:block;font-size:.5em;margin-top:.25em;color:var(--accent-text)}
h2{font-size:1.5rem;color:var(--accent);line-height:1.1}
p{margin:0}
.lead{color:var(--muted);font-size:17px}
.rings{width:72px;height:44px;color:var(--accent)}
.facts{display:grid;gap:10px}
.fact{background:var(--tint);border-radius:18px;padding:14px 16px}
.fact small{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fact strong{font-size:17px}
.photo{margin:0;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#0d1b2a;display:grid;place-items:center}
.photo img{display:block;width:100%;max-height:52vh;object-fit:contain}
.q{display:grid;gap:10px}
.q h3{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;justify-content:space-between}
.q h3 .pt{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ans{display:grid;gap:8px}
.ans input{width:100%;font:inherit;font-size:18px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--fg)}
.ans input:focus{outline:none;border-color:var(--accent)}
.given{border-radius:14px;padding:12px 16px;border:2px solid var(--line);font-weight:600;font-size:17px;overflow-wrap:anywhere}
.given small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;opacity:.8}
.given.right{background:var(--ok-bg);border-color:var(--ok)}
.given.wrong{background:var(--bad-bg);border-color:var(--bad)}
.tl{justify-self:start;background:none;border:0;padding:6px 0 0;color:var(--accent-text);font:inherit;font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.todo{font-size:13px;color:var(--accent-ink);background:var(--accent-text);border-radius:12px;padding:10px 12px;font-weight:600}
.note{display:grid;gap:4px;background:var(--tint);border-radius:18px;padding:14px 16px;font-size:15.5px}
.note strong{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-text)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:12px 18px;border-radius:16px;border:2px solid var(--accent);font:inherit;font-weight:700;font-size:17px;cursor:pointer;width:100%;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent-text)}
.row{display:flex;gap:10px}
.row .btn{flex:1}
.big{font-family:var(--font-display);font-size:clamp(3.4rem,18vw,5rem);line-height:1;color:var(--accent);text-align:center;font-variant-numeric:tabular-nums}
.big small{font-size:.4em;color:var(--muted)}
.recap{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.recap div{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:1;border:2px solid var(--line);max-width:100%}
.recap img{width:100%;height:100%;object-fit:cover;display:block}
.recap span{position:absolute;right:4px;bottom:4px;background:var(--accent-ink);color:var(--accent-text);font-size:12px;font-weight:700;border-radius:99px;padding:1px 7px}
.recap div.full{border-color:var(--ok)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<canvas id="confetti" hidden></canvas>
<main class="app" id="app"></main>
<script src="vragen.js"></script>
<script>
const KEY="cuimhne-quiz-v4";
let st=load()||{i:-1,ans:{}};
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(st)); }catch(e){} }
const app=document.getElementById("app");

// vrij antwoord: juist als het een sleutelwoord bevat of er sterk op lijkt
function norm(t){ return (t||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim(); }
function lev(a,b){ const d=Array.from({length:a.length+1},(_,i)=>[i]); for(let j=1;j<=b.length;j++) d[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[a.length][b.length]; }
function isRight(n,txt){
  if(!FOTOS[n].waar) return false; const t=norm(txt); if(!t) return false; const words=t.split(" ");
  return (FOTOS[n].ok||[norm(FOTOS[n].waar)]).some(k=>{ k=norm(k); if(t.includes(k)) return true;
    const kw=k.split(" ").length, tol=Math.max(1,Math.floor(k.length/4));
    for(let i=0;i+kw<=words.length;i++){ if(lev(words.slice(i,i+kw).join(" "),k)<=tol) return true; }
    return k.length>=5 && lev(t,k)<=tol; });
}
function points(n){ const a=st.ans[n]||{}, f=FOTOS[n]; return f.waar&&a.ok?1:0; }
function maxPoints(){ return FOTOS.reduce((s,f)=>s+(f.waar?1:0),0); }
function score(){ return FOTOS.reduce((s,_,n)=>s+points(n),0); }
function done(n){ const a=st.ans[n]||{}, f=FOTOS[n]; return !f.waar||a.txt!=null; }

function bar(){
  const n=st.i, pct=n<0?0:Math.round((Math.min(n,FOTOS.length))/FOTOS.length*100);
  return `<div class="bar"><span class="count">${n>=0&&n<FOTOS.length?`Foto ${n+1} van ${FOTOS.length}`:"Cuimhne"}</span><span class="score"><b>${score()}</b> punten</span></div>
  <div class="progress"><span style="width:${pct}%"></span></div>`;
}

function render(){
  if(st.i<0) return cover();
  if(st.i>=FOTOS.length) return end();
  const n=st.i, f=FOTOS[n], a=st.ans[n]||{};
  const q1 = !f.waar ? `<div class="todo">Plaats nog in te vullen in vragen.js</div>`
    : a.txt==null ? `<form class="ans" id="f"><input id="txt" autocomplete="off" placeholder="Typ jullie antwoord" aria-label="Waar is deze foto genomen?"><button class="btn" type="submit">Controleer</button></form>`
    : `<div class="given ${a.ok?'right':'wrong'}"><small>Jullie antwoord</small>${a.txt.replace(/</g,"&lt;")}</div>`;
  const fin=done(n);
  app.innerHTML=bar()+`<section class="card">
    <figure class="photo"><img src="img/${f.img}" alt="Foto ${n+1}"></figure>
    <div class="q"><h3>Waar is deze foto genomen?<span class="pt">1 punt</span></h3>${q1}</div>
    ${fin?`<div class="note"><strong>${points(n)?"Juist! ":"Helaas. "}Het was ${f.waar}.</strong>${f.weetje||""}${!a.ok&&f.waar?`<button class="tl" id="override">Toch juist? Reken goed</button>`:""}</div>`:""}
    <div class="row">
      ${n>0?`<button class="btn ghost" id="prev">← Vorige</button>`:""}
      <button class="btn" id="next" ${fin?"":"disabled style='opacity:.4'"}>${n+1<FOTOS.length?"Volgende foto →":"Naar de uitslag"}</button>
    </div>
  </section>`;
  const form=app.querySelector("#f");
  form?.addEventListener("submit",e=>{ e.preventDefault(); const v=app.querySelector("#txt").value.trim(); if(!v) return;
    st.ans[n]={txt:v, ok:isRight(n,v)}; save(); render(); });
  if(form) setTimeout(()=>app.querySelector("#txt")?.focus({preventScroll:true}),50);
  app.querySelector("#override")?.addEventListener("click",()=>{ st.ans[n].ok=true; save(); render(); });
  app.querySelector("#prev")?.addEventListener("click",()=>go(n-1));
  app.querySelector("#next")?.addEventListener("click",()=>{ if(done(n)) go(n+1); });
}
function go(i){ st.i=i; save(); render(); window.scrollTo(0,0); if(i>=FOTOS.length) confetti(); }

function cover(){
  app.innerHTML=`<section class="card">
    <svg class="rings" viewBox="0 0 72 44" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="26" cy="22" r="16"/><circle cx="46" cy="22" r="16"/></svg>
    <div class="eyebrow">Cuimhne is Gaelic voor herinnering</div>
    <h1>${QUIZ.titel}<span class="sub">${QUIZ.ondertitel}</span></h1>
    <p class="lead">${FOTOS.length} foto's uit de voorbije jaren. Bij elke foto één vraag: waar was dit? Typ jullie antwoord. Het hoeft niet letterlijk, als het in de buurt komt telt het. Elk juist antwoord is een punt waard.</p>
    <div class="facts">
      <div class="fact"><small>Voor</small><strong>${QUIZ.voor}</strong></div>
      <div class="fact"><small>Van</small><strong>${QUIZ.van}</strong></div>
    </div>
    <button class="btn" id="start">${Object.keys(st.ans).length?"Verder spelen":"Start de quiz"}</button>
    ${Object.keys(st.ans).length?`<button class="btn ghost" id="reset">Opnieuw beginnen</button>`:""}
  </section>`;
  app.querySelector("#start").addEventListener("click",()=>{ let i=0; while(i<FOTOS.length&&done(i)&&st.ans[i]) i++; go(Math.min(i,FOTOS.length-1)); });
  app.querySelector("#reset")?.addEventListener("click",()=>{ st={i:-1,ans:{}}; save(); render(); });
}

function end(){
  const s=score(), m=maxPoints(), pct=m?s/m:0;
  const msg= pct>=.9?"Jullie geheugen is beter dan een fotoalbum.": pct>=.7?"Sterk! De meeste momenten zitten nog vers.": pct>=.5?"Niet slecht. Tijd om samen de foto's nog eens door te bladeren.":"Hmm. Zijn jullie er wel zeker van dat jullie erbij waren?";
  app.innerHTML=bar()+`<section class="card">
    <div class="eyebrow" style="text-align:center">De uitslag</div>
    <div class="big">${s}<small> / ${m}</small></div>
    <h2 style="text-align:center">${msg}</h2>
    <div class="recap">${FOTOS.map((f,n)=>{ const p=points(n); return `<div class="${p?'full':''}"><img src="img/${f.img}" alt="">${f.waar?`<span>${p?'✓':'✗'}</span>`:''}</div>`; }).join("")}</div>
    <p class="muted" style="text-align:center;color:var(--muted)">Met liefde verzameld door ${QUIZ.van}.</p>
    <div class="row"><button class="btn ghost" id="back">← Terug</button><button class="btn" id="again">Opnieuw spelen</button></div>
  </section>`;
  app.querySelector("#back").addEventListener("click",()=>go(FOTOS.length-1));
  app.querySelector("#again").addEventListener("click",()=>{ st={i:-1,ans:{}}; save(); render(); });
}

function confetti(){
  const c=document.getElementById("confetti"), ctx=c.getContext("2d"); c.hidden=false; c.width=innerWidth; c.height=innerHeight;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){ c.hidden=true; return; }
  const cols=["#005EB8","#FFFFFF","#A68D5A","#9b2c2c","#2d5b3e","#D2BF92"];
  const ps=Array.from({length:150},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.6,w:6+Math.random()*6,h:8+Math.random()*8,c:cols[Math.random()*6|0],vy:2+Math.random()*3,vx:(Math.random()-.5)*2,r:Math.random()*6.28,vr:(Math.random()-.5)*.25}));
  const t0=performance.now();
  (function f(now){ ctx.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{ p.y+=p.vy; p.x+=p.vx; p.r+=p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); });
    if(now-t0<6000) requestAnimationFrame(f); else c.hidden=true; })(t0);
}
render();
</script>
</body>
</html>
